name: Publish and Release

on:
  push:
    branches:
      - main
  # Recovery path for a release whose tag exists but whose npm publish or
  # registry update did not land. See docs/RELEASES.md.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
        type: string
      publish_npm:
        description: Publish the package before updating the registry
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  # Every push to main re-computes the next version from the conventional commit
  # messages and keeps a single release PR open. Merging that PR is what tags,
  # releases and publishes; there is no manual release button.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release # Optional: for enhanced security
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-please-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          # Do not add release-type here. The action ignores config-file whenever
          # release-type is set, which would silently drop
          # include-component-in-tag and start tagging codex-acp-vX.Y.Z instead of
          # vX.Y.Z. The node release type is declared in that config instead, so
          # nothing is lost by leaving this out.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  # The gate for both paths: nothing is published unless this passes. Its `if`
  # rather than `needs` alone decides whether a release is happening, because on
  # workflow_dispatch the release-please job is skipped.
  #
  # Deliberately not in the `release` environment: OPENAI_API_KEY is a repository
  # secret, so this needs nothing from it, and staying out keeps the job off the
  # environment's deployment branch policy.
  verify:
    needs: [release-please]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.publish_npm) || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    # Without this a stalled step burns the full 6h runner limit before anyone
    # notices the release did not publish. A hung apt mirror already cost one
    # release that way. Sized for the worst case of its steps: apt retries, then
    # the unit and e2e suites, both of which run their files serially.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure sandboxing
        timeout-minutes: 15
        run: |
          # Acquire::*::Timeout only guards a single socket operation, so a mirror
          # that stalls once the headers are in never trips it -- that ate a 6h
          # runner limit, then a 5min step cap. Kill each attempt from the outside
          # and retry the fetch instead. No Acquire::Retries: apt retrying inside a
          # killed window would just burn the budget without ever finishing.
          #
          # The per-attempt budgets are generous on purpose. When the image's
          # package lists are stale, a healthy `update` pulls ~5MB of indexes and
          # takes about two minutes; a tighter cap killed it mid-download three
          # times in a row and turned "slow but fine" into a failed release.
          # Languages=none drops the Translation-* files, which nothing here reads.
          apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Languages=none)
          for attempt in 1 2; do
            if timeout 300 sudo apt-get "${apt_opts[@]}" update \
              && timeout 120 sudo apt-get "${apt_opts[@]}" install --yes bubblewrap; then
              installed=yes
              break
            fi
            echo "apt attempt ${attempt} stalled or failed, retrying"
            sleep 10
          done
          if [ -z "${installed:-}" ]; then
            echo "::error::bubblewrap install failed after 3 attempts"
            exit 1
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Run e2e tests
        # The suite drives a live model, so a wedged turn hangs instead of
        # failing. Bound it well above the ~3min happy path.
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:e2e

  publish-npm:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # Optional: for enhanced security
    permissions:
      contents: read
      id-token: write # npm trusted publishing, so there is no npm token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # prepublishOnly builds the bundle.
      - run: npm publish --access public

  trigger-registry-update:
    needs: publish-npm
    if: ${{ always() && (needs.publish-npm.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.publish_npm)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Generate token scoped to the registry repo
        uses: actions/create-github-app-token@v3
        id: registry-token
        with:
          app-id: ${{ secrets.REGISTRY_UPDATER_APP_ID }}
          private-key: ${{ secrets.REGISTRY_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: registry

      - name: Dispatch registry version update
        env:
          GH_TOKEN: ${{ steps.registry-token.outputs.token }}
        run: |
          gh workflow run update-versions.yml \
            --repo ${{ github.repository_owner }}/registry \
            --ref main \
            -f apply=true \
            -f agents=codex-acp
